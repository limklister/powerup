class BootScene extends Phaser.Scene{
 constructor(){super('Boot');}
 preload(){for(const k in SPRITE_FILES)this.load.image(k,SPRITE_FILES[k]);}
 create(){
  const g=this.make.graphics({x:0,y:0,add:false});
  for(const k in SPRITES){if(SPRITE_FILES[k])continue;const[w,h,f]=SPRITES[k];g.clear();f(g);g.generateTexture(k,w,h);}
  // ikoner för powerups (färgad ruta); byt mot pixelkonst med SPRITE_FILES['pu_<id>']
  for(const id in PU){const k='pu_'+id;if(SPRITE_FILES[k])continue;g.clear();R(g,0xffffff,0,0,10,10);R(g,PU[id].color,1,1,8,8);R(g,0x000000,0,0,10,1);g.generateTexture(k,10,10);}
  g.destroy();
  const go=()=>{if(this.scene.isActive('Boot'))this.scene.start('Menu');};
  let done=false;const once=()=>{if(!done){done=true;go();}};
  try{Promise.race([document.fonts.load('8px "Press Start 2P"'),new Promise(r=>setTimeout(r,1500))]).then(once,once);}catch(_){once();}
 }
}

function audio(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();}catch(_){}return AC;}
function makeNoise(ac){const n=ac.createBuffer(1,Math.floor(ac.sampleRate*.3),ac.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return n;}
function musicNodes(){const ac=audio();if(!ac)return null;
 if(!MUS.master){MUS.master=ac.createGain();MUS.master.gain.value=MUS.on?1:0;MUS.master.connect(ac.destination);MUS.noise=makeNoise(ac);}return ac;}
function mNote(ac,dest,type,midi,t,dur,vol){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=440*Math.pow(2,(midi-69)/12);
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+.02);}
function mHit(ac,dest,noise,kind,t){
 if(kind==='kick'){const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+.1);
  g.gain.setValueAtTime(.22,t);g.gain.exponentialRampToValueAtTime(.001,t+.12);o.connect(g);g.connect(dest);o.start(t);o.stop(t+.14);return;}
 const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain(),sn=kind==='snare';s.buffer=noise;f.type=sn?'bandpass':'highpass';f.frequency.value=sn?1800:7000;
 g.gain.setValueAtTime(sn?.09:.03,t);g.gain.exponentialRampToValueAtTime(.001,t+(sn?.09:.03));s.connect(f);f.connect(g);g.connect(dest);s.start(t);s.stop(t+.12);}
function scheduleStep(ac,dest,noise,T,tr,step,t){
 const spb=60/T.bpm/2,b=Math.floor(step/8)%8,pos=step%8,deg=T.prog[b],row=(b<4?T.c1:T.c2)[b%4],ch=row[pos];
 if(ch!=='-'){const nx=row[(pos+1)%8];mNote(ac,dest,T.wave,T.root+tr+dm(deg+TONES[+ch]),t,spb*(nx==='-'?1.7:.95),T.lv);}
 const bs=T.bass[pos];
 if(bs!=='-')mNote(ac,dest,'triangle',T.root+tr-24+dm(bs==='5'?deg+4:deg),t,spb*1.7,.11);
 if(T.drums>=1&&(pos===0||pos===4||(T.drums===3&&(pos===2||pos===6))))mHit(ac,dest,noise,'kick',t);
 if(T.drums>=2){if(T.drums!==3&&(pos===2||pos===6))mHit(ac,dest,noise,'snare',t);if(T.drums===3&&(pos===3||pos===7))mHit(ac,dest,noise,'snare',t);if(pos%2===1)mHit(ac,dest,noise,'hat',t);}
}
function musicTick(){const ac=AC;if(!ac||!MUS.tune||!MUS.on||ac.state!=='running')return;

 while(MUS.next<ac.currentTime+.15){scheduleStep(ac,MUS.master,MUS.noise,MUS.tune,MUS.tr,MUS.step,MUS.next);MUS.next+=spb;MUS.step++;}}
function musicStart(name,tr){tr=tr||0;if(MUS.name===name&&MUS.tr===tr&&MUS.tune)return;
 MUS.name=name;MUS.tr=tr;MUS.tune=TUNES[name];MUS.step=0;const ac=musicNodes();MUS.next=ac?ac.currentTime+.08:0;
 if(!MUS.timer)MUS.timer=setInterval(musicTick,25);}
function musicStop(){MUS.tune=null;MUS.name='';}

   Checkpoint-flaggor (K) läggs ut automatiskt var 5:e del (och före bossarenan). */
function genLevel(wi,st){
 const W=WORLDS[wi],n=Math.round(W.chunks*1.5)+st*3,last=st===2,seq=['start'];let prev='start';
 for(let i=0;i<n;i++){let c;if([[4],[5,12],[4,11]][st].includes(i))c='stairs';else{do{c=pick(W.pool);}while(c===prev);}seq.push(c);prev=c;}
 const endCol=1+16*seq.length,rows=[];
 for(let y=0;y<ROWS;y++){let s='#';
  for(const id of seq){const c=CHUNKS[id];
   if(y===0)s+='#'.repeat(16);else if(y<8)s+=E;else if(y<GROUND)s+=c.top[y-8];else s+=c.g;}
  rows.push(s);}
 const put=(y,x,ch)=>{rows[y]=rows[y].slice(0,x)+ch+rows[y].slice(x+1);};
 const cp=(x0,x1,step)=>{for(let x=x0;step>0?x<=x1:x>=x1;x+=step)if(rows[13][x]==='.'&&rows[14][x]==='#'){put(13,x,'K');return;}};
 for(let i=5;i<seq.length;i+=5)cp(1+16*i+1,1+16*i+3,1);
 cp(endCol-3,endCol-9,-1);
 const w=last?ARENA_COLS:GOAL_COLS,tail=[];
 for(let y=0;y<ROWS;y++){const a=new Array(w).fill('.');
  if(y===0||y>=GROUND)a.fill('#');
  if(last){if(y===11)for(const c of[5,6,7,8,21,22,23,24])a[c]='=';if(y===8)for(const c of[13,14,15,16])a[c]='=';}
  else{if(y===13)a[8]='G';if(y===12)for(const c of[3,4,5])a[c]='o';}
  a[w-1]='#';tail.push(a.join(''));}
 for(let y=0;y<ROWS;y++)rows[y]+=tail[y];
 return{map:rows,arenaCol:endCol,cols:endCol+w,last};
}

 if(gr&&!g.floorAt(e.x+e.dir*(e.width*e.scaleX/2+3),e.y+e.height*e.scaleY/2+4))e.dir*=-1;
 b.setVelocityX(e.dir*this.speed*sc);e.setFlipX(e.dir<0);}

const RUN={pus:{},coins:0,world:0,stage:0,lives:3,kills:0,time:0};

class GameScene extends Phaser.Scene{
 constructor(){super('Game');}

  this.wi=RUN.world;this.stage=RUN.stage;this.isLast=this.stage===2;const W=WORLDS[this.wi],th=W.theme;

   airJumps:0,shootCd:0,dropT:0,jumping:false,grounded:false,boss:null,bossDef:null,bossState:'none',beams:[],rects:[],platRects:[],kills:0,
   coins:RUN.coins,pus:RUN.pus,maxHp:3,hp:3,pc:0,toastT:0,lastSafe:null,safeT:0});
  this.cameras.main.setBackgroundColor(th.bg);
  this.physics.world.gravity.y=0;
  for(let i=0;i<40;i++){const w=rnd(60,170),h=rnd(30,120);
   this.add.rectangle(i*75+rnd(-20,20),VH,w,h,i%2?th.hill:th.hill2).setOrigin(.5,1).setScrollFactor(.35).setDepth(-5);}
  this.solids=this.physics.add.staticGroup();this.plats=this.physics.add.staticGroup();this.spikes=this.physics.add.staticGroup();
  this.enemies=this.physics.add.group();this.bullets=this.physics.add.group();this.ebullets=this.physics.add.group();
  this.coinsG=this.physics.add.group();this.orbs=this.physics.add.group();this.portals=this.physics.add.staticGroup();this.flags=this.physics.add.staticGroup();this.portalOn=false;

  this.enforceCap();this.recompute();this.hp=this.maxHp;this.recompute();
  const cam=this.cameras.main;cam.setBounds(0,0,this.levelW,VH);cam.startFollow(p,true,.12,.12);cam.setRoundPixels(true);
  this.physics.add.collider(p,this.solids);

  this.physics.add.collider(this.enemies,this.plats,null,(a,pl)=>a.type!=='ghost'&&this.platOK(a,pl));

  this.physics.add.collider(this.orbs,this.solids);

  this.physics.add.collider(this.ebullets,this.solids,b=>b.destroy());
  this.physics.add.overlap(p,this.enemies,(a,e)=>this.onPlayerEnemy(a,e));
  this.physics.add.overlap(this.bullets,this.enemies,(b,e)=>this.onBulletEnemy(b,e));
  this.physics.add.overlap(p,this.ebullets,(a,b)=>{this.hurtPlayer(b);b.destroy();});
  this.physics.add.overlap(p,this.coinsG,(a,c)=>this.pickCoin(c));

 buildWorld(){
  const L=genLevel(this.wi,this.stage),map=L.map,th=WORLDS[this.wi].theme;this.mapRows=map;
  this.levelW=L.cols*T;this.arenaX=L.arenaCol*T;this.start={x:T*3+8,y:T*13};
  const w=L.cols,open={},rects=[];
  for(let y=0;y<ROWS;y++){const seen={};let x=0;
   while(x<w){if(map[y][x]==='#'){const s=x;while(x<w&&map[y][x]==='#')x++;const k=s+'-'+(x-1);seen[k]=1;
     if(open[k])open[k].h++;else open[k]={x:s,y,w:x-s,h:1};}else x++;}
   for(const k in open)if(!seen[k]){rects.push(open[k]);delete open[k];}}
  for(const k in open)rects.push(open[k]);
  for(const r of rects)this.addSolid(r.x*T,r.y*T,r.w*T,r.h*T);
  for(let y=0;y<ROWS;y++)for(let x=0;x<w;x++){const ch=map[y][x],px=x*T,py=y*T;
   if(ch==='=')this.platRects.push({x:px,y:py,w:T,h:6}),this.plats.create(px+8,py+3,'plat');
   else if(ch==='^')this.spikes.create(px+8,py+12,'spike');
   else if(ch==='o')this.coinsG.create(px+8,py+8,'coin').setDepth(2);
   else if(ch==='?')this.spawnOrb(px+8,py+8);
   else if(ch==='P')this.start={x:px+8,y:py+8};
   else if(ch==='K')this.flags.create(px+8,py+4,'flag').setDepth(2);
   else if(ch==='G'){this.portals.create(px+8,py,'portal').setDepth(2);this.portalOn=true;}
   else if(CHAR[ch]){let t=CHAR[ch];if(!WORLDS[this.wi].enemies.includes(t))t=FALLBACK[t]||'walker';this.spawnEnemy(t,px+8,py+8);}}
  this.decorate(map,L);
 }
 decorate(map,L){
  const D=DECOR[this.wi],w=L.cols,wt=arr=>{let t=0;for(const e of arr)t+=e[1];let r=Math.random()*t;for(const e of arr){r-=e[1];if(r<=0)return e;}return arr[0];};
  const deco=(e,x,y,oy)=>{const o=e[2]||{},im=this.add.image(x,y,e[0]).setOrigin(.5,oy).setDepth(1.5);if(o.tint)im.setTint(o.tint);if(Math.random()<.5)im.setFlipX(true);
   if(o.anim==='glow')this.tweens.add({targets:im,alpha:.55,yoyo:true,repeat:-1,duration:rnd(900,1800)});
   else if(o.anim==='spin'){im.setOrigin(.5,.5);im.y=y-im.height/2+3;this.tweens.add({targets:im,angle:360,repeat:-1,duration:rnd(3000,6000)});}
   else if(o.anim==='flicker')this.tweens.add({targets:im,alpha:.55,yoyo:true,repeat:-1,duration:rnd(150,450)});
   return im;};
  let skip=0;
  for(let x=1;x<w-1;x++){const k=(L.last&&x>=L.arenaCol)?.5:1;
   if(skip>0)skip--;
   else for(let y=8;y<ROWS;y++)if(map[y][x]==='#'&&map[y-1][x]!=='#'){
    if(!'^KGP?'.includes(map[y-1][x])&&Math.random()<.3*k){deco(wt(D.ground),x*T+8+rnd(-3,3),y*T,1);skip=1+Math.floor(Math.random()*2);}
    break;}
   if(D.ceil.length&&map[0][x]==='#'&&map[1][x]==='.'&&Math.random()<D.ceilChance*k)deco(wt(D.ceil),x*T+8+rnd(-3,3),T,0);}
  for(const [tex,cnt,sf,al,o] of D.sky){const op=o||{};
   for(let i=0;i<cnt;i++){const im=this.add.image(rnd(0,this.levelW*sf+VW),op.bottom?VH:rnd(24,125),tex).setScrollFactor(sf).setDepth(-6+sf).setAlpha(al);
    if(op.bottom)im.setOrigin(.5,1);if(op.tint)im.setTint(op.tint);im.setScale((op.sc||1)*rnd(.85,1.2)*(op.bottom?rnd(.8,1.6):1));}}
 }
 makeFx(){const f=DECOR[this.wi].fx;this.fx=[];if(!f)return;
  for(let i=0;i<f.n;i++)this.fx.push({s:this.add.image(rnd(0,VW),rnd(0,VH),'px').setScrollFactor(0).setDepth(4).setTint(f.c).setAlpha(rnd(.3,.8)),ph:rnd(0,6),sp:rnd(.6,1.4)});}
 updateFx(dt){const f=DECOR[this.wi].fx;if(!f)return;const k=f.k;
  for(const o of this.fx){const s=o.s;o.ph+=dt*o.sp;
   if(k==='snow'){s.y+=(22+o.sp*14)*dt;s.x+=Math.sin(o.ph*1.3)*14*dt;}
   else if(k==='pollen'){s.x+=Math.sin(o.ph)*8*dt;s.y+=Math.cos(o.ph*.7)*5*dt;}
   else if(k==='dust'){s.x+=6*dt*o.sp;s.y+=Math.sin(o.ph)*4*dt;}
   else if(k==='spores'){s.y-=(8+o.sp*8)*dt;s.x+=Math.sin(o.ph)*6*dt;}
   else if(k==='embers'){s.y-=(25+o.sp*20)*dt;s.x+=Math.sin(o.ph*2)*10*dt;s.setAlpha(.4+.4*Math.abs(Math.sin(o.ph*3)));}
   else if(k==='stars')s.setAlpha(.25+.6*Math.abs(Math.sin(o.ph)));
   if(s.y>VH+4)s.y=-4;else if(s.y<-4)s.y=VH+4;if(s.x>VW+4)s.x=-4;else if(s.x<-4)s.x=VW+4;}}
 addSolid(x,y,w,h){const ts=this.add.tileSprite(x,y,w,h,'tile').setOrigin(0,0).setTint(WORLDS[this.wi].theme.tile).setDepth(1);
  this.physics.add.existing(ts,true);this.solids.add(ts);this.rects.push({x,y,w,h});
  this.add.rectangle(x,y===0?y+h-3:y,w,3,DECOR[this.wi].top).setOrigin(0,0).setDepth(1.1);return ts;}
 solidAt(x,y){for(const r of this.rects)if(x>=r.x&&x<r.x+r.w&&y>=r.y&&y<r.y+r.h)return true;return false;}
 floorAt(x,y){if(this.solidAt(x,y))return true;for(const r of this.platRects)if(x>=r.x&&x<r.x+r.w&&y>=r.y&&y<r.y+r.h+4)return true;return false;}
 platOK(a,pl){if(a===this.player&&(this.gdir<0||this.dropT>0||this.dashT>0))return false;return a.body.prev.y+a.body.height<=pl.body.top+2;}
 ps(id){return this.pst[id]||(this.pst[id]={});}
 proc(){if((this.procB===undefined?8:this.procB)>=1){this.procB=(this.procB===undefined?8:this.procB)-1;return true;}return false;}

 /* ---------- STATS ---------- */
 recompute(){
  const run=()=>{const s=Object.assign({},RUN_BASE);for(const id in this.pus){const d=PU[id];if(d&&d.stats)d.stats(s,this.pus[id],this);}
   for(const t of this.temp)t.f(s);const mod=WORLDS[this.wi].mod;if(mod)mod(s);if(s.glass)s.maxHp=1;if(s.capHp)s.maxHp=Math.min(s.maxHp,s.capHp);return s;};
  let s=run();this.maxHp=Math.round(s.maxHp);this.hp=Math.min(this.hp,this.maxHp);s=run();
  // mjuka tak: bortom gränsen ger varje extra procent bara en bråkdel (balans när man har många powerups)
  const soft=(v,c,k)=>v<=c?v:c+(v-c)*k;
  s.shotDmg=soft(s.shotDmg,2,.4);s.fireRate=Math.min(soft(s.fireRate,4.5,.4),8);s.shotSize=soft(s.shotSize,1.8,.4);
  s.speed=Math.min(soft(s.speed,150,.5),230);s.jump=Math.min(soft(s.jump,400,.5),470);s.homing=Math.min(s.homing,3);s.pierce=Math.min(s.pierce,4);
  s.size=clamp(s.size,.45,2.2);s.gravity=Math.max(s.gravity,150);
  s.shots=Math.min(7,Math.round(s.shots));s.maxJumps=Math.min(5,Math.round(s.maxJumps));this.stats=s;
  if(this.player){const p=this.player,old=p.scaleY;
   if(Math.abs(old-s.size)>.001){p.y-=(s.size-old)*p.height/2*this.gdir;p.setScale(s.size);}}
 }
 emit(ev,ctx){ctx=ctx||{};for(const id in this.pus){const d=PU[id],f=d&&d.on&&d.on[ev];if(f)f(this,this.pus[id],ctx);}return ctx;}
 rollPowerup(n){const out=[];const cands=[];
  for(const id in PU){const d=PU[id],st=this.pus[id]||0;if(st>=d.max)continue;if(d.requires&&!d.requires.every(r=>this.pus[r]))continue;
   cands.push([id,RARITY[d.rarity]*(d.rarity==='c'?1:1+.3*this.stats.luck)]);}
  while(out.length<n&&cands.length){let tot=0;for(const c of cands)tot+=c[1];let r=Math.random()*tot,i=0;
   for(;i<cands.length-1;i++){r-=cands[i][1];if(r<=0)break;}out.push(cands[i][0]);cands.splice(i,1);}
  return out;}
 syncOrder(){const cnt=Object.assign({},this.pus),o=RUN.order||[],n=[];
  for(let i=o.length-1;i>=0;i--)if(cnt[o[i]]>0){n.unshift(o[i]);cnt[o[i]]--;}
  const ex=[];for(const id in cnt)for(let k=0;k<cnt[id];k++)ex.push(id);RUN.order=ex.concat(n);}
 cleanupPu(id){const st=this.pst[id],d=PU[id];if(!st)return;if(d&&d.onLose)d.onLose(this,st);
  const kill=(v,dep)=>{if(!v||dep>3||typeof v!=='object')return;if(v.def&&v.type)return;
   if(v instanceof Phaser.GameObjects.GameObject){v.destroy();return;}
   if(v instanceof Phaser.GameObjects.Group){v.destroy(true);return;}
   if(Array.isArray(v)){for(const x of v)kill(x,dep+1);return;}for(const k in v)kill(v[k],dep+1);};
  for(const k in st)kill(st[k],0);delete this.pst[id];}
 enforceCap(){this.syncOrder();const lost=[];
  while(RUN.order.length>MAX_ACTIVE){const id=RUN.order.shift();if(this.pus[id]>1)this.pus[id]--;else{delete this.pus[id];this.cleanupPu(id);}lost.push(id);}
  if(lost.length){if(!this.pus.gravflip&&!this.pus.magshoes&&this.gdir<0&&this.player){this.gdir=1;this.player.setFlipY(false);}
   this.recompute();if(this.refreshIcons&&this.icons)this.refreshIcons();}return lost;}
 acquire(id){const d=PU[id];this.pus[id]=(this.pus[id]||0)+1;this.syncOrder();RUN.order.push(id);this.syncOrder();const lost=this.enforceCap();this.recompute();
  this.toast(d.name.toUpperCase()+': '+d.desc+(lost.length?'\n(tappade: '+lost.map(i=>PU[i].name).join(', ')+')':''));sfx('pick');this.burst(this.player.x,this.player.y,d.color,18);
  if(d.onGet)d.onGet(this,this.pus[id]);this.refreshIcons();}

 /* ---------- HUVUDLOOP ---------- */
 update(time,delta){
  const dt=Math.min(delta,50)/1000;
  if(IN.pressed.pause||IN.pressed.list){
   if(this.mode==='play'){this.mode='pause';this.physics.world.pause();this.openList();musicDuck(true);}
   else if(this.mode==='pause'){this.closeOv();this.mode='play';this.physics.world.resume();musicDuck(false);}}
  if(this.mode==='play')this.playUpdate(dt);else this.modeUpdate(dt);
  this.updateFx(dt);this.drawHud(dt);IN.end();
 }
 playUpdate(dt){
  this.t+=dt;RUN.time+=dt;this.procB=Math.min(8,(this.procB===undefined?8:this.procB)+dt*8);
  for(const id in this.pus){const d=PU[id];if(d&&d.pre)d.pre(this,dt,this.pus[id]);}
  this.updatePlayer(dt);this.updatePowerups(dt);this.updateEnemies(dt);this.updateBoss(dt);this.updateBullets(dt);this.updateBeams(dt);
  const p=this.player,S=this.stats;
  if(S.magnet>0)this.coinsG.getChildren().forEach(c=>{const d=Phaser.Math.Distance.Between(c.x,c.y,p.x,p.y);
   if(d<S.magnet&&(!c.drop||this.t-c.born>.3)){const a=Math.atan2(p.y-c.y,p.x-c.x),sp=140+(S.magnet-d);c.body.setGravityY(0);c.body.setVelocity(Math.cos(a)*sp,Math.sin(a)*sp);}});
  for(let i=this.temp.length-1;i>=0;i--){this.temp[i].t-=dt;if(this.temp[i].t<=0){this.temp.splice(i,1);this.recompute();}}
  if(p.y>VH+40)this.fall();
 }

 /* ---------- SPELARE ---------- */
 updatePlayer(dt){
  const p=this.player,b=p.body,S=this.stats,gd=this.gdir;
  const dir=(IN.held.right?1:0)-(IN.held.left?1:0);if(dir){p.face=dir;p.setFlipX(dir<0);}
  const grounded=gd>0?(b.blocked.down||b.touching.down):(b.blocked.up||b.touching.up);
  const wasG=this.grounded;this.grounded=grounded;const vyd=b.velocity.y*gd;
  const wallL=b.blocked.left||b.touching.left,wallR=b.blocked.right||b.touching.right;
  if(grounded){
   if(!wasG){const fs=this.fallSpeed;this.fallSpeed=0;
    if(this.pounding){this.pounding=false;this.explode(p.x,p.y+8*gd,62+34*S.quake,3+S.stompDmg+2*S.quake,0xc0c8e0);this.shake(5);}
    this.emit('land',{fs});
    if(S.bounceLand&&fs>150){b.setVelocityY(-fs*.62*gd);this.grounded=false;}
    else if(fs>120)this.burst(p.x,p.y+8*gd,0xd8d0c0,5);}
   this.coyote=S.coyote;this.airJumps=S.maxJumps-1;this.airTime=0;
   this.safeT-=dt;if(this.safeT<=0&&this.floorAt(p.x-9,p.y+12)&&this.floorAt(p.x+9,p.y+12)){this.safeT=.3;this.lastSafe={x:p.x,y:p.y-2};}
  }else{this.coyote-=dt;this.airTime+=dt;this.fallSpeed=Math.max(this.fallSpeed,vyd);}
  if(IN.pressed.jump)this.jbuf=.12;else this.jbuf-=dt;
  if(this.dropT>0)this.dropT-=dt;
  if(grounded&&IN.pressed.down&&gd>0)this.dropT=.25;
  if(this.jbuf>0){
   if(grounded||this.coyote>0){this.doJump(1,false);this.jbuf=0;this.coyote=0;}
   else if(S.wallJump&&(wallL||wallR)){const side=wallL?1:-1;b.setVelocity(side*S.speed*1.1,-S.jump*.95*gd);this.lockX=.18;p.face=side;p.setFlipX(side<0);
    this.jumping=true;this.jbuf=0;this.emit('jump',{air:true});sfx('jump');}
   else if(this.airJumps>0){this.airJumps--;this.doJump(.95,true);this.jbuf=0;}
  }
  if(this.jumping&&!IN.held.jump&&b.velocity.y*gd<0){b.velocity.y*=.5;this.jumping=false;}
  if(b.velocity.y*gd>=0)this.jumping=false;
  // dash
  this.dashCd-=dt;
  if(S.dash&&IN.pressed.dash&&this.dashCd<=0&&this.dashT<=0){this.dashT=.16;this.dashCd=S.dashCd;this.dashDir=p.face||1;this.emit('dash');sfx('dash');}
  // horisontell rörelse
  const move=this.lockX>0?0:dir;this.lockX-=dt;
  if(this.dashT>0){this.dashT-=dt;b.setVelocity(this.dashDir*S.dashSpeed,0);if(Math.random()<.7)this.burst(p.x,p.y,0x9fd8ff,1);
   if(this.dashT<=0)b.setVelocityX(this.dashDir*S.speed);}
  else{const ac=(grounded?1:.7)*S.accel;
   if(move!==0)b.velocity.x=approach(b.velocity.x,move*S.speed,ac*dt);else b.velocity.x=approach(b.velocity.x,0,(grounded?S.fric:S.fric*.25)*dt);}
  b.setGravityY(this.dashT>0?0:S.gravity*gd);
  const vd=b.velocity.y*gd;
  if(S.wallJump&&!grounded&&vd>40&&((wallL&&IN.held.left)||(wallR&&IN.held.right)))b.velocity.y=40*gd;
  if(S.glide&&IN.held.jump&&!grounded&&vd>45&&!this.pounding)b.velocity.y=45*gd;
  if(S.pound&&!grounded&&IN.pressed.down&&!this.pounding){this.pounding=true;this.jumping=false;b.setVelocity(0,560*gd);}
  if(this.pounding)b.velocity.x*=.9;
  // skjuta
  this.shootCd-=dt;
  if(IN.held.shoot&&this.shootCd<=0&&!this.pounding&&!S.noAuto){this.shootCd=1/S.fireRate;this.fireFrom(p.x,p.y,p.face||1,false);}
  // osårbarhet
  if(this.inv>0){this.inv-=dt;p.setAlpha(Math.floor(this.t*20)%2?.35:1);}else p.setAlpha(this.dashT>0&&S.phase?.5:1);
 }
 doJump(m,air){const p=this.player,S=this.stats;p.body.setVelocityY(-S.jump*m*this.gdir);this.jumping=true;this.pounding=false;
  this.emit('jump',{air});sfx('jump');this.burst(p.x,p.y+8*this.gdir,air?0xcfe8ff:0xd8d0c0,air?6:3);}
 fall(){const p=this.player;this.hp-=1;this.recompute();sfx('hurt');this.shake(4);
  if(this.hp<=0){const c=this.emit('death',{cancel:false});if(!c.cancel){this.die();return;}}
  this.gdir=1;p.setFlipY(false);const s=this.lastSafe;p.body.reset(s.x,s.y);p.body.setVelocity(0,0);this.inv=1.5;this.pounding=false;this.fallSpeed=0;}
 updatePowerups(dt){
  for(const id in this.pus){const d=PU[id];if(d&&d.update)d.update(this,dt,this.pus[id]);}
  if(IN.pressed.special)for(const id in this.pus){const d=PU[id];if(d&&d.special)d.special(this,this.pus[id]);}
 }
}
/* =====================================================================
   SPELSCENEN – del B: strid, fiender, bossar, effekter, HUD, lägen
   ===================================================================== */
Object.assign(GameScene.prototype,{
 /* ---------- effekter ---------- */
 burst(x,y,color,n){if(this.pcount>160)return;this.pcount=(this.pcount||0)+n;
  for(let i=0;i<n;i++){const s=this.add.image(x,y,'px').setTint(color).setDepth(9);
   this.tweens.add({targets:s,x:x+rnd(-20,20),y:y+rnd(-20,20),alpha:0,duration:rnd(250,500),onComplete:()=>{s.destroy();this.pcount--;}});}},
 shake(i){this.cameras.main.shake(120,i/1000);},
 explode(x,y,r,dmg,color){const c=this.add.circle(x,y,4,color,.6).setDepth(8);
  this.tweens.add({targets:c,scale:r/4,alpha:0,duration:260,onComplete:()=>c.destroy()});
  this.burst(x,y,color,10);sfx('boom');this.shake(2);
  for(const e of this.enemiesNear(x,y,r))this.hurtEnemy(e,dmg,{});},
 zap(x1,y1,x2,y2){const l=this.add.line(0,0,x1,y1,x2,y2,0x9fe8ff).setOrigin(0,0).setDepth(8).setLineWidth(1.5);
  this.tweens.add({targets:l,alpha:0,duration:150,onComplete:()=>l.destroy()});},
 toast(s){this.toastT=2.6;this.toastTxt.setText(s).setAlpha(1);},
 heal(n){this.hp=Math.min(this.maxHp,this.hp+n);this.recompute();},
 phase(b){const r=b.hp/b.maxHp;return r<.33?2:r<.66?1:0;},

 /* ---------- fiender ---------- */
 spawnEnemy(type,x,y){const d=ENEMIES[type],e=this.enemies.create(x,y,d.tex).setDepth(3);
  e.type=type;e.def=d;if(d.scale)e.setScale(d.scale);const pc=Object.keys(this.pus).length;e.hp=d.hp*(1+.3*this.wi)*(1+.025*pc);e.fireCd=0;
  if(type!=='mini'&&Math.random()<Math.min(.35,.012*pc)){e.elite=true;e.hp*=2.2;e.setScale((d.scale||1)*1.2);}e.maxHp=e.hp;e.dir=Math.random()<.5?-1:1;e.tm=Math.random()*2;e.slow=0;e.burn=0;e.bladeCd=0;e.sc=0;e.flash=0;
  if(d.gravity)e.body.setGravityY(d.gravity);if(d.init)d.init(this,e);return e;},
 enemiesNear(x,y,r){const o=[];for(const e of this.enemies.getChildren())if(e.active&&!e.dead&&Phaser.Math.Distance.Between(x,y,e.x,e.y)<r+e.displayWidth/2)o.push(e);return o;},
 nearestEnemy(x,y,r){let best=null,bd=r;for(const e of this.enemies.getChildren()){if(!e.active||e.dead)continue;const d=Phaser.Math.Distance.Between(x,y,e.x,e.y);if(d<bd){bd=d;best=e;}}return best;},
 updateEnemies(dt){
  for(const e of this.enemies.getChildren().slice()){if(!e.active)continue;
   e.sc-=dt;e.pc-=dt;e.bladeCd-=dt;e.fireCd=(e.fireCd||0)-dt;
   if(e.isBoss&&e.bud!==undefined)e.bud=Math.min(e.maxHp*.07,e.bud+e.maxHp*.033*dt);
   const sc=this.eScale*(e.slow>0?.5:1);e.slow-=dt;
   if(e.burn>0){e.burn-=dt;e.burnT=(e.burnT||0)-dt;if(e.burnT<=0){e.burnT=.5;this.hurtEnemy(e,.7,{fire:true});if(!e.active)continue;}}
   if(!e.isBoss)e.def.update(this,e,dt,sc);
   if(e.flash>0){e.flash-=dt;e.setTintFill(0xffffff);}
   else if(e.slow>0)e.setTint(0x8fd8ff);else if(e.burn>0)e.setTint(0xff9a40);
   else if(e.st!=='tele'){if(e.elite)e.setTint(0xffa0ff);else e.clearTint();}
   if(Math.abs(e.x-this.player.x)>700&&!e.isBoss)continue;
  }},
 hurtEnemy(e,dmg,o){if(!e.active||e.dead)return;
  if(e.isBoss){ // bossar tål bara en viss skada per sekund så att kraftiga builds inte avgör striden på sekunder
   dmg=Math.min(dmg,e.maxHp*.03);if(e.bud===undefined)e.bud=e.maxHp*.07;
   if(dmg<=e.bud)e.bud-=dmg;else{const ok=Math.max(0,e.bud);dmg=ok+(dmg-ok)*.06;e.bud=0;}}
  e.hp-=dmg;e.flash=.08;
  if(o.ignite)e.burn=3;if(o.frost)e.slow=2.2;if(!o.fire)sfx('hit');
  if(e.hp<=0)this.killEnemy(e);},
 killEnemy(e){e.dead=true;
  if(e.isBoss){this.bossDefeated();return;}
  this.burst(e.x,e.y,0xffffff,8);this.kills++;RUN.kills++;
  this.dropCoins(e.x,e.y,(e.elite?6:1)+(Math.random()<.4?1:0));
  if(Math.random()<(e.elite?.5:.04)+.008*this.stats.luck)this.spawnOrb(e.x,e.y-8);
  this.emit('kill',{e});if(e.def.onKill)e.def.onKill(this,e);e.destroy();},
 dropCoins(x,y,n){for(let i=0;i<n;i++){const c=this.coinsG.create(x,y,'coin').setDepth(2);c.drop=true;c.born=this.t;
  c.body.setGravityY(500).setBounce(.4).setVelocity(rnd(-50,50),rnd(-130,-60));}},
 pickCoin(c){if(c.drop&&this.t-c.born<.35)return;c.destroy();sfx('coin');for(let i=0,m=this.stats.coinMul||1;i<m;i++){this.coins++;
  if(this.coins%25===0)this.heal(1);if(this.coins%100===0){RUN.lives++;this.toast('EXTRALIV!');}if(this.coins%40===0)this.spawnOrb(this.player.x+14*(this.player.face||1),this.player.y-6);}RUN.coins=this.coins;if(this.pus.tipjar)this.recompute();this.emit('coin');},
 spawnOrb(x,y){const o=this.orbs.create(x,y,'orb').setDepth(2);o.body.setAllowGravity(false);o.body.setImmovable(true);
  this.tweens.add({targets:o,y:y-4,yoyo:true,repeat:-1,duration:700,ease:'Sine.easeInOut'});return o;},

 onPlayerEnemy(p,e){

 }
 build(){
  const pg=Math.floor(this.cur/this.per);if(pg===this.page)return;this.page=pg;
  for(const c of this.cells)c.forEach(o=>o.destroy());this.cells=[];
  const start=pg*this.per;
  for(let k=0;k<this.per;k++){const i=start+k;if(i>=this.ids.length)break;const col=k%2,row=Math.floor(k/2),x=14+col*232,y=24+row*20;
   const icon=this.add.image(x+5,y+5,'pu_'+this.ids[i]),t=txt(this,x+14,y+1,PU[this.ids[i]].name,{}).setInteractive({useHandCursor:true});
   t.on('pointerdown',()=>{this.cur=i;this.toggle();});t.on('pointerover',()=>{this.cur=i;});
   this.cells.push([icon,t]);}
  this.pgTxt=this.pgTxt||txt(this,VW-6,6,'',{}).setOrigin(1,0);
 }
 toggle(){const id=this.ids[this.cur];if(this.chosen[id])delete this.chosen[id];else this.chosen[id]=1;sfx('ui');}
 update(){
  const n=this.ids.length;
  if(IN.pressed.right)this.cur=Math.min(n-1,this.cur+1);if(IN.pressed.left)this.cur=Math.max(0,this.cur-1);
  if(IN.pressed.down)this.cur=Math.min(n-1,this.cur+2);if(IN.pressed.up)this.cur=Math.max(0,this.cur-2);
  if(IN.pressed.jump)this.toggle();
  if(IN.pressed.special){this.sw=(this.sw+1)%WORLDS.length;sfx('ui');}
  this.swTxt.setText('Bana '+(this.sw+1)+': '+WORLDS[this.sw].name);
  if(IN.pressed.pause){this.scene.start('Menu');IN.end();return;}
  if(IN.pressed.start){newRun(this.chosen);RUN.world=this.sw;this.scene.start('Game');IN.end();return;}
  this.build();
  this.cells.forEach(([ic,t],k)=>{const i=this.page*this.per+k,id=this.ids[i];
   t.setColor(i===this.cur?'#ffb02e':(this.chosen[id]?'#7dffb0':'#f0e8d0')).setText((this.chosen[id]?'+ ':'  ')+PU[id].name);});
  const id=this.ids[this.cur],d=PU[id];this.hint.setText(d.desc+(d.requires?'  (kräver: '+d.requires.map(r=>PU[r].name).join(', ')+')':''));
  this.pgTxt.setText('Sida '+(this.page+1)+'/'+Math.ceil(n/this.per)+'  Valda: '+Object.keys(this.chosen).length);
  IN.end();
 }
}

window.__game=new Phaser.Game({
 type:Phaser.AUTO,width:VW,height:VH,parent:'game',pixelArt:true,roundPixels:true,backgroundColor:'#171327',
 physics:{default:'arcade',arcade:{gravity:{y:0},debug:false}},
 scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},
 scene:[BootScene,MenuScene,LabScene,GameScene]
});

</script>
